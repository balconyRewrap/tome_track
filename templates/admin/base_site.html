{% extends "admin/base_site.html" %}

{% block nav-global %}
    <form action="{% url 'admin-clear-cache' %}" method="post" style="display: inline-block; margin-left: 12px;">
        {% csrf_token %}
        <button
            type="submit"
            class="button"
            style="padding: 6px 10px; border-radius: 4px; border: 1px solid #ddd; cursor: pointer;"
            onclick="return confirm('Clear the whole cache?');"
        >
            Clear cache
        </button>
    </form>
{% endblock %}
