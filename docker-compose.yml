services:
  django:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
      - ./media:/app/media
      - ./logs:/app/logs
      - static_volume:/app/staticfiles
    env_file:
      - .env.production
    depends_on:
      - db
      - redis
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env.production
    volumes:
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./nginx/nginx-http.conf.template:/etc/nginx/templates/http.conf.template:ro
      - ./nginx/nginx-https.conf.template:/etc/nginx/templates/https.conf.template:ro
      - ./dist:/usr/share/nginx/html:ro
      - static_volume:/app/staticfiles:ro
      - ./media:/app/media:ro
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    command: /bin/sh /entrypoint.sh
    depends_on:
      - django

  certbot:
    image: certbot/certbot:latest
    env_file:
      - .env.production
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    depends_on:
      - nginx
    entrypoint: >
      /bin/sh -c "if [ -z \"$$DOMAIN_NAME\" ] || [ -z \"$$LETSENCRYPT_EMAIL\" ]; then
                    echo 'DOMAIN_NAME and LETSENCRYPT_EMAIL must be set in .env.production';
                    exit 1;
                  fi;
                  while :; do
                    if [ \"$$LETSENCRYPT_STAGING\" = \"1\" ]; then
                      staging_arg='--staging';
                    else
                      staging_arg='';
                    fi;
                    certbot certonly --webroot -w /var/www/certbot \
                      --email \"$$LETSENCRYPT_EMAIL\" --agree-tos --no-eff-email \
                      -d \"$$DOMAIN_NAME\" --non-interactive --keep-until-expiring $$staging_arg || true;
                    sleep 12h;
                  done"

  celery_worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
      - ./logs:/app/logs
    env_file:
      - .env.production
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env.production
    depends_on:
      - db
      - redis
      - celery_worker

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
  static_volume:
  certbot_www:
  letsencrypt: